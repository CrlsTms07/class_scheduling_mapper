; Enough for PDFs with logos, a 2 MB logo upload and a 5 MB schedule workbook.
memory_limit = 256M
upload_max_filesize = 6M
post_max_size = 8M
expose_php = Off
display_errors = Off
log_errors = On

; Code never changes while the server runs, so PHP need not keep checking it.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 96
