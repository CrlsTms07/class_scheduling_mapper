<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1240" viewBox="0 0 900 1240" font-family="Arial, Helvetica, sans-serif">
  <title>Validation Framework of the ERCIHS Class Scheduling System</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#991b1b"/>
    </marker>
  </defs>
  <rect width="900" height="1240" fill="#ffffff"/>

  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#790D16">Validation Framework</text>
  <text x="450" y="62" text-anchor="middle" font-size="14" fill="#374151">Every class passes the same five layers, whether it is placed by hand or imported from Excel.</text>

  <!-- Input -->
  <rect x="60" y="85" width="560" height="110" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="80" y="112" font-size="16" font-weight="bold" fill="#111827">INPUT</text>
  <rect x="80" y="122" width="250" height="60" rx="8" fill="#ffffff" stroke="#9ca3af"/>
  <text x="205" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">Manual entry</text>
  <text x="205" y="166" text-anchor="middle" font-size="12" fill="#374151">Plotter: tap or drag a subject</text>
  <rect x="350" y="122" width="250" height="60" rx="8" fill="#ffffff" stroke="#9ca3af"/>
  <text x="475" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">Excel import</text>
  <text x="475" y="166" text-anchor="middle" font-size="12" fill="#374151">.xlsx template or class program</text>

  <line x1="340" y1="195" x2="340" y2="218" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 1 -->
  <g>
    <rect x="60" y="222" width="560" height="140" rx="12" fill="#ffffff" stroke="#790D16" stroke-width="2"/>
    <rect x="60" y="222" width="560" height="34" rx="12" fill="#790D16"/>
    <rect x="60" y="244" width="560" height="12" fill="#790D16"/>
    <text x="80" y="245" font-size="15" font-weight="bold" fill="#ffffff">LAYER 1 · Input validation</text>
    <text x="80" y="280" font-size="13" fill="#111827">• Required fields and right formats (Form Requests, import row checks)</text>
    <text x="80" y="302" font-size="13" fill="#111827">• Day is Monday to Friday; the time is a period of the section's bell</text>
    <text x="92" y="320" font-size="13" fill="#111827">schedule (never a break)</text>
    <text x="80" y="342" font-size="13" fill="#111827">• Section, subject, teacher and room exist and are in the user's scope</text>
  </g>
  <line x1="340" y1="362" x2="340" y2="385" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 2 -->
  <g>
    <rect x="60" y="389" width="560" height="140" rx="12" fill="#ffffff" stroke="#790D16" stroke-width="2"/>
    <rect x="60" y="389" width="560" height="34" rx="12" fill="#790D16"/>
    <rect x="60" y="411" width="560" height="12" fill="#790D16"/>
    <text x="80" y="412" font-size="15" font-weight="bold" fill="#ffffff">LAYER 2 · Hard conflict check (ConflictService)</text>
    <text x="80" y="447" font-size="13" fill="#111827">• Same term, same day, overlapping [start, end): teacher, room or section</text>
    <text x="80" y="469" font-size="13" fill="#111827">• Back-to-back classes are allowed; rejected entries are ignored</text>
    <text x="80" y="491" font-size="13" fill="#111827">• Plotter offers only free periods that fit the subject's remaining minutes</text>
    <text x="80" y="513" font-size="13" fill="#111827">• On a conflict: says who or what is busy, and suggests free periods and rooms</text>
  </g>
  <line x1="340" y1="529" x2="340" y2="552" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 3 -->
  <g>
    <rect x="60" y="556" width="560" height="118" rx="12" fill="#ffffff" stroke="#790D16" stroke-width="2"/>
    <rect x="60" y="556" width="560" height="34" rx="12" fill="#790D16"/>
    <rect x="60" y="578" width="560" height="12" fill="#790D16"/>
    <text x="80" y="579" font-size="15" font-weight="bold" fill="#ffffff">LAYER 3 · Database guard (PostgreSQL)</text>
    <text x="80" y="614" font-size="13" fill="#111827">• Exclusion constraints no_teacher_conflict, no_room_conflict,</text>
    <text x="92" y="632" font-size="13" fill="#111827">no_section_conflict (btree_gist): the last line, even if two saves race</text>
    <text x="80" y="656" font-size="13" fill="#111827">• SQLSTATE 23P01 is turned into the same plain message as Layer 2</text>
  </g>
  <line x1="340" y1="674" x2="340" y2="697" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="352" y="690" font-size="12" font-style="italic" fill="#374151">saved as a draft class</text>

  <!-- Layer 4 -->
  <g>
    <rect x="60" y="701" width="560" height="162" rx="12" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
    <rect x="60" y="701" width="560" height="34" rx="12" fill="#b45309"/>
    <rect x="60" y="723" width="560" height="12" fill="#b45309"/>
    <text x="80" y="724" font-size="15" font-weight="bold" fill="#ffffff">LAYER 4 · Soft rules: flags (FlagService)</text>
    <text x="80" y="759" font-size="13" fill="#111827">• Minutes a week not equal to the subject's (Homeroom Guidance: 60)</text>
    <text x="80" y="781" font-size="13" fill="#111827">• Outside the section's or teacher's shift, or overlapping a break</text>
    <text x="80" y="803" font-size="13" fill="#111827">• Teacher over the limit of 5 subjects</text>
    <text x="80" y="825" font-size="13" fill="#111827">• No adviser, an open slot still unfilled, or a class with no room</text>
    <text x="80" y="847" font-size="13" fill="#111827">• Saved, with a red or amber badge; listed in the Conflict and Validation Report</text>
  </g>
  <line x1="340" y1="863" x2="340" y2="886" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 5 -->
  <g>
    <rect x="60" y="890" width="560" height="118" rx="12" fill="#ffffff" stroke="#790D16" stroke-width="2"/>
    <rect x="60" y="890" width="560" height="34" rx="12" fill="#790D16"/>
    <rect x="60" y="912" width="560" height="12" fill="#790D16"/>
    <text x="80" y="913" font-size="15" font-weight="bold" fill="#ffffff">LAYER 5 · Submit gate</text>
    <text x="80" y="948" font-size="13" fill="#111827">• A section is submitted only when every flag is fixed or acknowledged</text>
    <text x="80" y="970" font-size="13" fill="#111827">• Open slots cannot be submitted</text>
    <text x="80" y="992" font-size="13" fill="#111827">• Then the Admin approves (locked) or rejects with remarks</text>
  </g>
  <line x1="340" y1="1008" x2="340" y2="1031" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Output -->
  <rect x="60" y="1035" width="560" height="110" rx="12" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <text x="80" y="1062" font-size="16" font-weight="bold" fill="#0f766e">OUTPUT</text>
  <text x="80" y="1087" font-size="13" fill="#111827">• A conflict-free, approved schedule</text>
  <text x="80" y="1109" font-size="13" fill="#111827">• Class Program, Teacher Program, Room Schedule and other reports (PDF, CSV)</text>
  <text x="80" y="1131" font-size="13" fill="#111827">• Teacher's My Schedule and the public Guest view</text>

  <!-- Rejection side path -->
  <rect x="670" y="300" width="190" height="300" rx="12" fill="#fef2f2" stroke="#991b1b" stroke-width="1.5"/>
  <text x="765" y="330" text-anchor="middle" font-size="15" font-weight="bold" fill="#991b1b">BLOCKED</text>
  <text x="765" y="356" text-anchor="middle" font-size="12" fill="#111827">Not saved. The user</text>
  <text x="765" y="374" text-anchor="middle" font-size="12" fill="#111827">sees why (per field,</text>
  <text x="765" y="392" text-anchor="middle" font-size="12" fill="#111827">per import row, or the</text>
  <text x="765" y="410" text-anchor="middle" font-size="12" fill="#111827">conflicting teacher,</text>
  <text x="765" y="428" text-anchor="middle" font-size="12" fill="#111827">room or section) and</text>
  <text x="765" y="446" text-anchor="middle" font-size="12" fill="#111827">fixes it.</text>
  <text x="765" y="480" text-anchor="middle" font-size="12" fill="#111827">HTTP 422</text>
  <text x="765" y="498" text-anchor="middle" font-size="12" fill="#111827">(Layers 1, 2, 5)</text>
  <text x="765" y="522" text-anchor="middle" font-size="12" fill="#111827">SQLSTATE 23P01</text>
  <text x="765" y="540" text-anchor="middle" font-size="12" fill="#111827">(Layer 3)</text>
  <line x1="620" y1="292" x2="668" y2="340" stroke="#991b1b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-red)"/>
  <line x1="620" y1="459" x2="668" y2="450" stroke="#991b1b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-red)"/>
  <line x1="620" y1="615" x2="668" y2="570" stroke="#991b1b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-red)"/>
  <path d="M620,950 C700,950 765,800 765,602" fill="none" stroke="#991b1b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-red)"/>

  <!-- Legend -->
  <g font-size="12" fill="#374151">
    <rect x="60" y="1170" width="16" height="16" fill="#790D16"/><text x="84" y="1183">Hard rule: blocks saving or submitting</text>
    <rect x="330" y="1170" width="16" height="16" fill="#b45309"/><text x="354" y="1183">Soft rule: saved but flagged</text>
    <line x1="560" y1="1178" x2="600" y2="1178" stroke="#991b1b" stroke-width="1.8" stroke-dasharray="6 4"/><text x="608" y="1183">Fails a check</text>
    <text x="60" y="1214" font-size="11">ERCIHS Class Scheduling System · final system, Nov 2026 (no Auto-fill)</text>
  </g>
</svg>
